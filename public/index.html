<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelAO — Trip Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <span class="logo">✈</span>
        <span class="brand-name">TravelAO</span>
      </div>
      <p class="tagline">Tell us about your trip — get a complete plan in seconds.</p>
      <p class="hero-sub">Offline by default · optional DeepSeek AI</p>
    </div>
  </header>

  <main class="layout">
    <section class="form-card" aria-label="Trip details">
      <h2>Plan your trip</h2>
      <form id="trip-form" class="form">
        <div class="field full">
          <label for="mode">Planner mode</label>
          <select id="mode" name="mode">
            <option value="offline">Offline (no API key)</option>
            <option value="deepseek">DeepSeek AI</option>
          </select>
        </div>

        <div id="deepseek-fields" class="field full apikey-field" hidden>
          <label for="apiKey">DeepSeek API key <span class="muted">(<a href="https://platform.deepseek.com" target="_blank" rel="noopener">platform.deepseek.com</a>)</span></label>
          <input id="apiKey" name="apiKey" type="password" placeholder="sk-…" autocomplete="off" />
          <label class="remember">
            <input id="rememberKey" type="checkbox" checked /> Remember key on this device
          </label>
        </div>

        <div class="field">
          <label for="relationship">Relationship</label>
          <select id="relationship" name="relationship" required>
            <option value="">Select…</option>
            <option value="couple">Couple</option>
            <option value="friends">Friends</option>
            <option value="family">Family</option>
          </select>
        </div>

        <div class="field">
          <label for="groupSize">Group size & ages</label>
          <input id="groupSize" name="groupSize" type="text" placeholder="e.g. 2 adults, or 2 adults + 2 kids (6, 9)" />
        </div>

        <div class="field">
          <label for="dates">Dates</label>
          <input id="dates" name="dates" type="text" placeholder="e.g. Oct 10 – Oct 13, 2026" required />
        </div>

        <div class="field">
          <label for="budget">Budget</label>
          <input id="budget" name="budget" type="text" placeholder="e.g. $2500 total for two" required />
        </div>

        <div class="field">
          <label for="purpose">Main purpose</label>
          <input id="purpose" name="purpose" type="text" placeholder="e.g. anniversary, relaxation, adventure" required />
        </div>

        <div class="field">
          <label for="destination">Destination <span class="muted">(optional)</span></label>
          <input id="destination" name="destination" type="text" placeholder="e.g. Kyoto — or leave blank for suggestions" />
        </div>

        <div class="field full">
          <label for="notes">Extra notes <span class="muted">(optional)</span></label>
          <textarea id="notes" name="notes" rows="3" placeholder="Dietary needs, accessibility, must-see sights, etc."></textarea>
        </div>

        <div class="actions">
          <button type="submit" id="submit-btn" class="btn-primary">
            <span class="btn-label">Generate plan</span>
            <span class="spinner" hidden></span>
          </button>
        </div>
        <p id="error" class="error" hidden></p>
      </form>
    </section>

    <section class="result-card" aria-label="Trip plan">
      <div class="result-header">
        <h2>Your travel plan</h2>
        <div class="result-actions">
          <button id="copy-btn" class="btn-ghost" disabled>Copy</button>
          <button id="print-btn" class="btn-ghost" disabled>Print</button>
        </div>
      </div>
      <div id="result" class="result">
        <div class="placeholder">
          <div class="placeholder-icon">🗺</div>
          <h3>Your itinerary will appear here</h3>
          <p>Use <strong>Offline</strong> anytime, or switch to <strong>DeepSeek AI</strong> for richer plans.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>TravelAO · offline + DeepSeek · build deepseek1</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module" src="app.js?v=deepseek1"></script>
</body>
</html>
